# Welcome / Start
welcome.message=👋 <b>Spovishun is here!</b> {0}\n\n📋 <b>Registration:</b>\n• /register [$b DD.MM] — register (optionally set your birthday right away)\n• Or just send any message\n\nCommands:\n• /all — notify everyone\n• /ping &lt;group&gt; [text] — notify a group\n• /random [group] — pick a random member\n• /groups — list groups\n• /members — list members\n• /birthday DD.MM | off — set your birthday\n• /language — pick the chat language\n• /whatsnew — release notes for the current version\n• /whatsnew $h — version history\n\n🔐 <b>Admin:</b>\n• /newgroup &lt;name&gt; — create a group\n• /delgroup &lt;name&gt; — delete a group\n• /addtogroup &lt;name&gt; @user1, @user2 — add to a group\n• /removefromgroup &lt;name&gt; @user1, @user2 — remove from a group\n• /editg &lt;name&gt; $icon &lt;emoji&gt; — group icon ($icon off — remove)\n• /grantrole @user1, @user2 member|moderator|admin — assign a role to one or more members\n  └ member: basic access · moderator 🛡: manages groups · admin 🔐: full access\n• /birthday DD.MM @user — set a member's birthday\n• /whatsnew $on | $off — turn release announcements on or off
welcome.invitation=📋 <b>Member registration</b>\n\nI have added the administrators and the users from recent messages to the database.\n\nIf you are not in the system yet, please send any message (for example <code>/register</code>) so I can register you.\n\nThis is required for you to use every feature of the bot.

