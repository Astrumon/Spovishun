# Welcome / Start
welcome.message=👋 <b>Spovishun на місці!</b> {0}\n\n📋 <b>Реєстрація:</b>\n• /register — зареєструватися в системі\n• Або просто напишіть будь-яке повідомлення\n\nКоманди:\n• /all — сповістити всіх\n• /ping &lt;група&gt; [текст] — сповістити групу\n• /random [група] — випадковий учасник\n• /groups — список груп\n• /members — список учасників\n• /birthday DD.MM | off — день народження\n• /whatsnew — нотатки до поточної версії\n• /whatsnew $h — історія версій\n\n🔐 <b>Адмін:</b>\n• /newgroup &lt;назва&gt; — створити групу\n• /delgroup &lt;назва&gt; — видалити групу\n• /addtogroup &lt;назва&gt; @user1, @user2 — додати до групи\n• /removefromgroup &lt;назва&gt; @user1, @user2 — видалити з групи\n• /grantrole @user1, @user2 member|moderator|admin — призначити роль одному або кільком учасникам\n  └ member: базовий доступ · moderator 🛡: керує групами · admin 🔐: повний доступ\n• /birthday DD.MM @user — задати ДН учаснику\n• /whatsnew $on | $off — увімкнути/вимкнути сповіщення про оновлення
welcome.invitation=📋 <b>Реєстрація учасників</b>\n\nЯ додав адміністраторів та користувачів з останніх повідомлень до бази даних.\n\nЯкщо вас ще немає в системі, будь ласка, напишіть будь-яке повідомлення (наприклад, <code>/register</code>), щоб я міг вас зареєструвати.\n\nЦе потрібно для того, щоб ви могли користуватися всіма функціями бота.

