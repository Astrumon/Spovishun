services:
  bot:
    build: .
    image: ghcr.io/astrumon/spovishun:latest
    container_name: spovishun-bot
    environment:
      PROFILE: ${PROFILE:-dev}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      EXPECTED_BOT_USERNAME: ${EXPECTED_BOT_USERNAME:-}
      ALLOWED_CHAT_IDS: ${ALLOWED_CHAT_IDS:-}
      # Dev DB — override host to Docker service name
      DEV_DATABASE_URL: jdbc:postgresql://postgres:5432/spovishun_dev
      DEV_DATABASE_USERNAME: ${DEV_DATABASE_USERNAME:-postgres}
      DEV_DATABASE_PASSWORD: ${DEV_DATABASE_PASSWORD}
      # Prod DB
      PROD_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-spovishun_prod}
      PROD_DATABASE_USERNAME: ${POSTGRES_USER:-postgres}
      PROD_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  postgres:
    image: postgres:16-alpine
    container_name: spovishun-db
    profiles: ["dev", "prod"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spovishun_dev}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-spovishun_dev}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
