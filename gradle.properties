kotlin.code.style=official

# Six modules with largely independent compile graphs (:common :domain :data :bot :admin-api :app)
# — parallel execution uses all runner/dev cores instead of one.
org.gradle.parallel=true

# Local build cache. On CI it lives at ~/.gradle/caches/build-cache-1, which setup-gradle persists as
# part of the Gradle User Home cache — so unchanged modules are not recompiled between runs
# (spovishun-159).
org.gradle.caching=true

# The default daemon heap (512m / 384m metaspace) causes GC churn on a Kotlin 2.3 multi-module build.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# Skips the configuration phase on a cache hit. Verified clean for every task set this project runs
# (test/integrationTest, e2eTest, ktlintCheck, detekt, generateMigration, runDev/runProd) — ktlint
# 12.x and detekt 2.0-alpha are both compatible. CI persists the entry across runs via the
# cache-encryption-key input on setup-gradle, which setup-gradle requires before it will store one.
org.gradle.configuration-cache=true
