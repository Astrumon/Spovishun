name: CI

on:
  pull_request:
    branches: [develop, main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      # ktlint is a hard gate — formatting violations fail the PR.
      - name: Run ktlint
        run: |
          chmod +x gradlew
          ./gradlew ktlintCheck

      # detekt is non-blocking while it ships only as a 2.0 alpha (the stable line is
      # incompatible with Kotlin 2.3 / Gradle 9). Findings are surfaced but do not fail the PR.
      - name: Run detekt
        continue-on-error: true
        run: ./gradlew detekt

      - name: Upload detekt report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detekt-report
          path: build/reports/detekt/

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: |
          chmod +x gradlew
          ./gradlew test

      - name: Run integration tests
        run: ./gradlew integrationTest

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: build/reports/tests/
