# Deploy workflow — triggered on PR merge into main or manually.
#
# Required GitHub repository secrets:
#   ORACLE_HOST      — public IP of the Oracle Cloud VM
#   ORACLE_USER      — SSH user (ubuntu)
#   ORACLE_SSH_KEY   — private SSH key contents (PEM format)
#
# GITHUB_TOKEN is provided automatically; packages: write allows ghcr.io push.

name: Deploy

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/astrumon/spovishun

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main')

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Oracle Cloud
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            cd ~/Spovishun
            docker compose --profile prod pull bot
            docker compose --profile prod up -d
            docker image prune -f
