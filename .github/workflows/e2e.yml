name: E2E Tests

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

# Keyed on the ref: a repo-global group would cancel PR A's in-flight e2e run whenever anyone
# pushed to PR B (spovishun-159).
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: spovishun_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          # Read-only consumer of the cache seeded by cache-warmup.yml on develop.
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Run e2e tests
        env:
          TEST_BOT_TOKEN: ${{ secrets.TEST_BOT_TOKEN }}
          TEST_HELPER_BOT_TOKEN: ${{ secrets.TEST_HELPER_BOT_TOKEN }}
          TEST_CHAT_ID: ${{ secrets.TEST_CHAT_ID }}
          TEST_ADMINS: ${{ secrets.TEST_ADMINS }}
          E2E_DATABASE_URL: jdbc:postgresql://localhost:5432/spovishun_e2e
          E2E_DATABASE_USERNAME: postgres
          E2E_DATABASE_PASSWORD: postgres
        run: ./gradlew e2eTest

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-reports
          path: app/build/reports/tests/e2eTest/
