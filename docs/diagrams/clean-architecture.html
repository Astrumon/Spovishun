<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spovishun — Clean Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1.5rem 3rem;
    }
    .diagram-wrap { width: 100%; max-width: 880px; }
    .header { margin-bottom: 1.75rem; }
    .eyebrow {
      font-family: 'Geist Mono', monospace;
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #4f5d75;
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: 'Instrument Serif', serif;
      font-size: 1.75rem;
      font-weight: 400;
      color: #2d3142;
      line-height: 1.2;
    }
    .subtitle {
      font-family: 'Geist', sans-serif;
      font-size: 12px;
      color: #7a8399;
      margin-top: 0.375rem;
    }
    svg { width: 100%; height: auto; display: block; }
    .footer {
      margin-top: 1.25rem;
      padding-top: 0.875rem;
      border-top: 1px solid rgba(45,49,66,0.12);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .footer-text {
      font-family: 'Geist Mono', monospace;
      font-size: 8px;
      color: #7a8399;
      letter-spacing: 0.10em;
    }
  </style>
</head>
<body>
  <div class="diagram-wrap">

    <div class="header">
      <p class="eyebrow">Architecture · Spovishun Telegram Bot</p>
      <h1>Clean Architecture</h1>
      <p class="subtitle">Шари та напрямок залежностей · Kotlin 2.3.0 · Koin · Exposed</p>
    </div>

    <svg viewBox="0 0 800 548" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#7F52FF"/>
        </marker>
        <marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#7a8399"/>
        </marker>
      </defs>

      <!-- Background -->
      <rect width="800" height="548" fill="#f5f5f5"/>

      <!-- ── ARROWS (drawn before boxes — z-order) ── -->

      <!-- presentation → domain (downward) -->
      <line x1="400" y1="112" x2="400" y2="152"
            stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="364" y="128" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="400" y="136" fill="#7a8399" font-size="8"
            font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DEPENDS ON</text>

      <!-- data → domain (upward) -->
      <line x1="400" y1="288" x2="400" y2="248"
            stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="364" y="264" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="400" y="272" fill="#7a8399" font-size="8"
            font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DEPENDS ON</text>

      <!-- ── PRESENTATION ── -->
      <rect x="80" y="24" width="640" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="80" y="24" width="640" height="88" rx="6"
            fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="96" y="34" width="96" height="12" rx="2"
            fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="144" y="43" fill="rgba(45,49,66,0.80)" font-size="7"
            font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PRESENTATION</text>
      <text x="400" y="80" fill="#2d3142" font-size="12" font-weight="600"
            font-family="'Geist', sans-serif" text-anchor="middle">Presentation Layer</text>
      <text x="400" y="96" fill="#4f5d75" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">TelegramBot · MessageHandler · commands/ · controller/ · util/</text>

      <!-- ── DOMAIN (focal) ── -->
      <rect x="80" y="152" width="640" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="80" y="152" width="640" height="96" rx="6"
            fill="rgba(127,82,255,0.08)" stroke="#7F52FF" stroke-width="1.2"/>
      <rect x="96" y="162" width="56" height="12" rx="2"
            fill="transparent" stroke="rgba(127,82,255,0.40)" stroke-width="0.8"/>
      <text x="124" y="171" fill="rgba(127,82,255,0.80)" font-size="7"
            font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DOMAIN</text>
      <text x="400" y="212" fill="#2d3142" font-size="12" font-weight="600"
            font-family="'Geist', sans-serif" text-anchor="middle">Domain Layer</text>
      <text x="400" y="228" fill="#4f5d75" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">model/ · service/ · cache/ · repository/ (interfaces)</text>

      <!-- ── DATA ── -->
      <rect x="80" y="288" width="640" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="80" y="288" width="640" height="88" rx="6"
            fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="96" y="298" width="40" height="12" rx="2"
            fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="116" y="307" fill="rgba(45,49,66,0.80)" font-size="7"
            font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DATA</text>
      <text x="400" y="344" fill="#2d3142" font-size="12" font-weight="600"
            font-family="'Geist', sans-serif" text-anchor="middle">Data Layer</text>
      <text x="400" y="360" fill="#4f5d75" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">db/ (Exposed) · mapper/ · memory/ (MockImpl)</text>

      <!-- ── COMMON (shared across all layers) ── -->
      <rect x="80" y="408" width="640" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="80" y="408" width="640" height="72" rx="6"
            fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="96" y="418" width="56" height="12" rx="2"
            fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="124" y="427" fill="rgba(79,93,117,0.80)" font-size="7"
            font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">COMMON</text>
      <text x="400" y="456" fill="#2d3142" font-size="12" font-weight="600"
            font-family="'Geist', sans-serif" text-anchor="middle">Common</text>
      <text x="400" y="472" fill="#4f5d75" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">ResultContainer · exceptions · extensions · logging</text>

      <!-- ── LEGEND ── -->
      <line x1="80" y1="508" x2="720" y2="508"
            stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="80" y="524" fill="#4f5d75" font-size="8"
            font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <!-- focal -->
      <rect x="156" y="516" width="12" height="12" rx="2"
            fill="rgba(127,82,255,0.08)" stroke="#7F52FF" stroke-width="1"/>
      <text x="172" y="524" fill="#4f5d75" font-size="8"
            font-family="'Geist Mono', monospace">FOCAL LAYER</text>
      <!-- layer -->
      <rect x="296" y="516" width="12" height="12" rx="2"
            fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="312" y="524" fill="#4f5d75" font-size="8"
            font-family="'Geist Mono', monospace">LAYER</text>
      <!-- shared -->
      <rect x="372" y="516" width="12" height="12" rx="2"
            fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="388" y="524" fill="#4f5d75" font-size="8"
            font-family="'Geist Mono', monospace">SHARED</text>
      <!-- depends on arrow -->
      <line x1="460" y1="520" x2="480" y2="520"
            stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <text x="488" y="524" fill="#4f5d75" font-size="8"
            font-family="'Geist Mono', monospace">DEPENDS ON</text>
    </svg>

    <div class="footer">
      <span class="footer-text">SPOVISHUN · CLEAN ARCHITECTURE</span>
      <span class="footer-text">DIAGRAM-DESIGN v5.0</span>
    </div>

  </div>
</body>
</html>
